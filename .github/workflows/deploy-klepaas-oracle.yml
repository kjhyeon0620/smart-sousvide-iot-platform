name: Build GHCR image and deploy via K-Le-PaaS

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/backend
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Unit Tests (Ingestion/Control/Watchdog/LoadTest)
        run: |
          ./gradlew test \
            --tests "com.iot.IoT.ingestion.*" \
            --tests "com.iot.IoT.control.*" \
            --tests "com.iot.IoT.watchdog.*" \
            --tests "com.iot.IoT.loadtest.*"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/arm64 backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Trigger K-Le-PaaS deployment
        env:
          KLEPAAS_DEPLOY_URL: ${{ secrets.KLEPAAS_DEPLOY_URL }}
          KLEPAAS_TOKEN: ${{ secrets.KLEPAAS_TOKEN }}
          KLEPAAS_REPOSITORY_ID: ${{ secrets.KLEPAAS_REPOSITORY_ID }}
          IMAGE_URI: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: |
          test -n "$KLEPAAS_DEPLOY_URL"
          test -n "$KLEPAAS_TOKEN"
          test -n "$KLEPAAS_REPOSITORY_ID"
          curl --fail-with-body -X POST "$KLEPAAS_DEPLOY_URL" \
            -H "Authorization: Bearer $KLEPAAS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"repository_id\": ${KLEPAAS_REPOSITORY_ID},
              \"branch_name\": \"${GITHUB_REF_NAME}\",
              \"commit_hash\": \"${GITHUB_SHA}\",
              \"image_uri\": \"${IMAGE_URI}\"
            }"
