name: Build GHCR image and deploy via K-Le-PaaS

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  id-token: write   # K-Le-PaaS 배포 요청에 쓰는 GitHub OIDC 토큰 발급

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/backend
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm   # 운영 노드와 같은 arm64에서 에뮬레이션 없이 이미지 빌드

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Unit Tests (Ingestion/Control/Watchdog/LoadTest)
        run: |
          ./gradlew test \
            --tests "com.iot.IoT.ingestion.*" \
            --tests "com.iot.IoT.control.*" \
            --tests "com.iot.IoT.watchdog.*" \
            --tests "com.iot.IoT.loadtest.*"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/arm64 backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Trigger K-Le-PaaS deployment
        env:
          KLEPAAS_DEPLOY_URL: ${{ secrets.KLEPAAS_DEPLOY_URL }}
          KLEPAAS_REPOSITORY_ID: ${{ secrets.KLEPAAS_REPOSITORY_ID }}
          IMAGE_URI: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: |
          test -n "$KLEPAAS_DEPLOY_URL"
          test -n "$KLEPAAS_REPOSITORY_ID"
          # 실행마다 발급되는 단기 토큰. K-Le-PaaS가 저장소·브랜치·커밋 claim을 요청과 대조한다
          OIDC_TOKEN=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=k-le-paas" | jq -r .value)
          test -n "$OIDC_TOKEN"
          echo "::add-mask::$OIDC_TOKEN"
          curl --fail-with-body -X POST "$KLEPAAS_DEPLOY_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"repository_id\": ${KLEPAAS_REPOSITORY_ID},
              \"branch_name\": \"${GITHUB_REF_NAME}\",
              \"commit_hash\": \"${GITHUB_SHA}\",
              \"image_uri\": \"${IMAGE_URI}\"
            }"
